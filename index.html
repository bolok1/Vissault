<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Assault v0.1</title>
<style>
body{margin:0;background:#050509;color:#eee;font-family:system-ui,sans-serif}.wrap{max-width:1000px;margin:auto;padding:14px}
h1{margin:4px 0;font-size:27px}.sub{opacity:.65;margin-bottom:12px}.panel{background:#101016;border:1px solid #292933;border-radius:14px;padding:12px;margin:10px 0}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;opacity:.8;display:block;margin-bottom:4px}
input,select,button{width:100%;box-sizing:border-box;padding:10px;border-radius:9px;border:1px solid #383844;background:#181821;color:white}
input[type=range]{padding:0}button{font-weight:700}button:disabled{opacity:.35}canvas{display:block;width:100%;background:#000;border-radius:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.status{font-size:12px;opacity:.7;margin-top:8px}
@media(max-width:650px){.controls{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>VISUAL ASSAULT <small>v0.1</small></h1><div class="sub">Music → procedural visuals. No AI. No upload.</div>
<div class="panel"><label>Audio</label><input id="file" type="file" accept="audio/*"><div id="track" class="status">Choose a track.</div></div>
<div class="panel controls">
<div><label>Visual mode</label><select id="mode"><option>Particle Storm</option><option>Tunnel</option><option>Rings</option><option>Reactive Grid</option><option>Plasma</option><option>Kaleidoscope</option><option>Chaos</option></select></div>
<div><label>Aspect</label><select id="aspect"><option>16:9</option><option>9:16</option><option>1:1</option></select></div>
<div><label>Intensity <b id="iv">8</b></label><input id="intensity" type="range" min="1" max="10" value="8"></div>
<div><label>Chaos <b id="cv">6</b></label><input id="chaos" type="range" min="0" max="10" value="6"></div>
<div><label>Beat punch <b id="bv">8</b></label><input id="beat" type="range" min="0" max="10" value="8"></div>
<div><label>Colour shift <b id="sv">7</b></label><input id="shift" type="range" min="0" max="10" value="7"></div>
</div>
<div class="panel"><canvas id="c" width="1280" height="720"></canvas>
<div class="row"><button id="play" disabled>▶ PLAY</button><button id="record" disabled>● RECORD VIDEO</button></div>
<div id="status" class="status"></div></div>
<div class="status">Export is WebM using your browser's MediaRecorder. Audio stays local.</div>
</div>
<script>
const $=id=>document.getElementById(id),c=$('c'),x=c.getContext('2d'),a=new Audio();
let ac,an,src,data,raf=0,obj,last=0,pulse=0,rec,chunks=[],recording=false;
['intensity','chaos','beat','shift'].forEach(id=>$(id).oninput=()=>$(id[0]+'v').textContent=$(id).value);
$('aspect').onchange=()=>{let q=$('aspect').value;c.width=q==='9:16'?720:q==='1:1'?720:1280;c.height=q==='9:16'?1280:q==='1:1'?720:720};
$('file').onchange=()=>{if(obj)URL.revokeObjectURL(obj);obj=URL.createObjectURL($('file').files[0]);a.src=obj;$('track').textContent=$('file').files[0].name;$('play').disabled=$('record').disabled=false};
async function init(){if(ac)return;ac=new AudioContext;an=ac.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=.8;src=ac.createMediaElementSource(a);src.connect(an);an.connect(ac.destination);data=new Uint8Array(an.frequencyBinCount)}
$('play').onclick=async()=>{await init();await ac.resume();if(a.paused){await a.play();$('play').textContent='❚❚ PAUSE'}else{a.pause();$('play').textContent='▶ PLAY'}if(!raf)draw()};
a.onended=()=>{ $('play').textContent='▶ PLAY'; if(recording)stopRec() };
function bands(){let b=0,m=0,h=0,n=data.length;for(let i=0;i<n;i++){let v=data[i]/255;if(i<n*.08)b+=v;else if(i<n*.35)m+=v;else h+=v}return[b/(n*.08),m/(n*.27),h/(n*.65)]}
function rgb(h,s,l){let q=s*Math.min(l,1-l),f=n=>l-q*Math.max(-1,Math.min((n+h*12)%12-3,9-(n+h*12)%12,1));return`rgb(${f(0)*255|0},${f(8)*255|0},${f(4)*255|0})`}
function draw(){raf=requestAnimationFrame(draw);if(!an)return;an.getByteFrequencyData(data);let[b,m,h]=bands(),e=(b+m+h)/3,I=+$('intensity').value/10,C=+$('chaos').value/10,P=+$('beat').value/10,S=+$('shift').value/10,t=performance.now()/1000,W=c.width,H=c.height,cx=W/2,cy=H/2;
let hit=b*.72+m*.28;if(hit>.72&&performance.now()-last>120){last=performance.now();pulse=1}pulse*=.9;
x.fillStyle='rgba(0,0,0,.17)';x.fillRect(0,0,W,H);x.globalCompositeOperation='lighter';let hue=(t*12*S+e*180)%360,mode=$('mode').value;
if(mode==='Particle Storm'||mode==='Chaos'){let N=100+I*260+C*200;for(let i=0;i<N;i++){let q=Math.random()*6.283,r=Math.random()**.65*Math.min(W,H)*.65,sp=(.4+e*2+pulse*P*7)*(1+C*2),xx=cx+Math.cos(q)*r,yy=cy+Math.sin(q)*r,px=cx+Math.cos(q)*Math.max(0,r-sp*12),py=cy+Math.sin(q)*Math.max(0,r-sp*12);x.strokeStyle=rgb((hue+i*.7)%360,.9,.45);x.lineWidth=.5+I*2+pulse*4;x.beginPath();x.moveTo(px,py);x.lineTo(xx,yy);x.stroke()}}
if(mode==='Tunnel'||mode==='Chaos'){for(let j=0;j<24;j++){let z=(j/24+t*(.12+e*.4))%1,r=z*z*Math.min(W,H)*.72;x.strokeStyle=rgb((hue+j*15)%360,.9,.35+.35*(1-z));x.lineWidth=1+I*2*(1-z);x.beginPath();for(let k=0;k<=48;k++){let q=k/48*6.283,rr=r*(1+Math.sin(q*6+t*3)*.025*C),xx=cx+Math.cos(q)*rr,yy=cy+Math.sin(q)*rr;k?x.lineTo(xx,yy):x.moveTo(xx,yy)}x.stroke()}}
if(mode==='Rings'){for(let j=0;j<12;j++){let q=(t*(.18+e*.4)+j/12)%1,r=q*Math.min(W,H)*.72;x.strokeStyle=rgb((hue+j*22)%360,.95,.45);x.lineWidth=(1+I*4)*(1-q)+pulse*12*P;x.beginPath();x.arc(cx,cy,r,0,6.283);x.stroke()}}
if(mode==='Reactive Grid'){for(let y=0;y<18;y++)for(let q=0;q<28;q++){let v=data[(q/28*data.length*.75)|0]/255,yy=y/18*H+(v*80*I+pulse*60*P)*Math.sin(q/3+t*2);x.fillStyle=rgb((hue+q*5+y*2)%360,.85,.4+v*.3);x.fillRect(q/28*W-1,yy-1,3+v*5,3+v*5)}}
if(mode==='Plasma'||mode==='Kaleidoscope'){let seg=mode==='Kaleidoscope'?12:1;for(let s=0;s<seg;s++){x.save();x.translate(cx,cy);x.rotate(s*6.283/seg);x.beginPath();for(let i=0;i<120;i++){let q=i/120*6.283,r=Math.min(W,H)*(.12+.1*Math.sin(q*7+t*2)+.15*b+.08*Math.sin(q*13-t*3)*C),xx=Math.cos(q)*r*(1+pulse*.4*P),yy=Math.sin(q)*r;i?x.lineTo(xx,yy):x.moveTo(xx,yy)}x.closePath();x.strokeStyle=rgb((hue+s*18)%360,.95,.45);x.lineWidth=1+I*3;x.stroke();x.restore()}}
x.globalCompositeOperation='source-over';x.fillStyle='rgba(255,255,255,.75)';x.font='14px system-ui';x.fillText('VISUAL ASSAULT // '+mode.toUpperCase(),15,23)}
function stopRec(){if(!recording)return;recording=false;rec.stop();$('record').textContent='● RECORD VIDEO'}
$('record').onclick=async()=>{await init();await ac.resume();if(recording){stopRec();return}if(a.paused)await a.play();let vs=c.captureStream(30),dest=ac.createMediaStreamDestination();src.connect(dest);let ms=new MediaStream([...vs.getVideoTracks(),...dest.stream.getAudioTracks()]);let typ=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(q=>MediaRecorder.isTypeSupported(q));rec=new MediaRecorder(ms,typ?{mimeType:typ}:{});chunks=[];recording=true;$('record').textContent='■ STOP & EXPORT';rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{let blob=new Blob(chunks,{type:rec.mimeType||'video/webm'}),u=URL.createObjectURL(blob),z=document.createElement('a');z.href=u;z.download='visual-assault.webm';z.click();setTimeout(()=>URL.revokeObjectURL(u),2000);$('status').textContent='Export complete.'};rec.start(1000)}
</script></body></html>
